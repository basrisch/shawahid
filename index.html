<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم الانتقال إلى الموقع الجديد | إدارة الشواهد التعليمية</title>
  
  <!-- تحويل تلقائي عبر الـ Meta Refresh بعد 5 ثوانٍ -->
  <meta http-equiv="refresh" content="5;url=https://basrisch.github.io/portfolio/">
  
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/u/0/d/1QfAv8PJgyadBVxdSjp2pa8FUB_jteU05">
  
  <!-- خط تجوال الأنيق + أيقونات Bootstrap -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #090d16 0%, #0f172a 45%, #1e293b 80%, #1e3a8a 100%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* زخارف خلفية خفيفة */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-circle-1 {
      width: 320px;
      height: 320px;
      background: rgba(212, 175, 55, 0.15);
      top: -60px;
      right: -60px;
    }
    .bg-circle-2 {
      width: 380px;
      height: 380px;
      background: rgba(30, 58, 138, 0.35);
      bottom: -80px;
      left: -80px;
    }

    /* كرت التحويل الرئيسي */
    .redirect-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6),
                  0 0 40px rgba(212, 175, 55, 0.08);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* أيقونة الشعار / النقل المتوهجة */
    .icon-wrapper {
      width: 90px;
      height: 90px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(30, 58, 138, 0.4));
      border: 2px solid rgba(212, 175, 55, 0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
      position: relative;
      animation: pulseGlow 2.5s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
        transform: scale(1);
      }
      100% {
        box-shadow: 0 0 35px rgba(212, 175, 55, 0.5);
        transform: scale(1.05);
      }
    }

    .icon-wrapper i {
      font-size: 42px;
      color: #f59e0b;
      filter: drop-shadow(0 2px 6px rgba(245, 158, 11, 0.4));
    }

    .badge-notice {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(212, 175, 55, 0.12);
      color: #f9f0b3;
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    p.description {
      font-size: 0.98rem;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 26px;
    }

    /* عداد الثواني الدائري / التنازلي */
    .timer-container {
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.92rem;
      color: #cbd5e1;
    }

    .timer-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: #f59e0b;
      color: #0f172a;
      font-weight: 800;
      border-radius: 50%;
      font-size: 1rem;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
    }

    /* زر الانتقال المباشر */
    .btn-redirect {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
      color: #0f172a;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.05rem;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.35);
      transition: all 0.3s ease;
      border: none;
    }

    .btn-redirect:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(212, 175, 55, 0.5);
      background: linear-gradient(135deg, #f59e0b 0%, #d4af37 100%);
      color: #000;
    }

    .btn-redirect:active {
      transform: translateY(0);
    }

    .url-display {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #64748b;
      word-break: break-all;
      direction: ltr;
    }

    .url-display a {
      color: #93c5fd;
      text-decoration: none;
    }

    .url-display a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .redirect-card {
        padding: 30px 20px;
      }
      h1 {
        font-size: 1.4rem;
      }
      .icon-wrapper {
        width: 76px;
        height: 76px;
      }
      .icon-wrapper i {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>

  <!-- زخارف الخلفية المضيئة -->
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>

  <div class="redirect-card">
    <div class="icon-wrapper">
      <i class="bi bi-box-arrow-up-right"></i>
    </div>

    <div class="badge-notice">
      <i class="bi bi-stars"></i> تم تحديث الرابط الرسمي
    </div>

    <h1>تم الانتقال إلى الموقع الجديد</h1>
    
    <p class="description">
      لقد تم نقل منصة <strong>إدارة الشواهد التعليمية</strong> إلى واجهتها وموقعها الجديد لتقديم تجربة أسرع وأكثر تطوراً.
    </p>

    <div class="timer-container">
      <i class="bi bi-hourglass-split text-warning fs-5"></i>
      <span>سيتم تحويلك تلقائياً خلال:</span>
      <span class="timer-badge" id="countdown">5</span>
      <span>ثوانٍ</span>
    </div>

    <a href="https://basrisch.github.io/portfolio/" id="directLink" class="btn-redirect">
      <span>الانتقال إلى الموقع الآن</span>
      <i class="bi bi-arrow-left fs-5"></i>
    </a>

    <div class="url-display">
      الرابط الجديد: <a href="https://basrisch.github.io/portfolio/">https://basrisch.github.io/portfolio/</a>
    </div>
  </div>

  <script>
    const targetUrl = "https://basrisch.github.io/portfolio/";
    let seconds = 5;
    const countdownEl = document.getElementById("countdown");

    const timer = setInterval(() => {
      seconds--;
      if (countdownEl) {
        countdownEl.textContent = seconds;
      }
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(targetUrl);
      }
    }, 1000);
  </script>
</body>
</html>
